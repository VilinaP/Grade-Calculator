<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Grade Calculator</title>
</head>

<body>

    <header class="menu">
            <h1>Grade Calculator</h1>
            <button type="button" aria-label="fold window button"><img src="assets/fold.png" alt="fold window" width="25"></button>
            <button type="button" aria-label="close window button"><img src="assets/exit.png" alt="close window" width="25"></button>
    </header>

    <main>
        <section class="class">
            <div class="new-class">
                <input type="text" id="new-class-name" maxlength="200" placeholder="New class name" aria-label="New class name">
                <button type="button" id="add-class">Add Class</button>
            </div>
            <h2>Class</h2>
            <div>
                <select name="subject" id="pick-class"></select>
                <button type="button" id="delete-class">Delete</button>
            </div>
            <p id="class-message" class="class-message" role="status"></p>
        </section>
        <section class="category-weight">
            <h2>Grade Categories</h2>
            <div class="scroll-category" id="category-list"></div>
            <p id="category-total" class="category-total" role="status"></p>
            <div class="category-form">
                <input type="text" id="category-name" maxlength="200" placeholder="Category name" aria-label="Category name">
                <input type="number" id="category-percent" min="0" max="100" step="0.01" placeholder="100" aria-label="Category percentage">
                <p>%</p>
            </div>
            <div class="category-buttons">
                <button type="button" class="add-category" id="save-category">Add</button>
                <button type="button" id="cancel-category" hidden>Cancel</button>
                <button type="button" class="delete-category" id="delete-category">Delete</button>
            </div>
            <p id="category-message" class="category-message" role="status"></p>
        </section>
        <section class="calculator">
            <h2>Grades</h2>
            <div class="scroll-grade" id="grade-list"></div>
            <div class="grade-form">
                <input type="text" id="grade-name" maxlength="200" placeholder="Assignment name" aria-label="Assignment name">
                <select id="grade-category" aria-label="Grade category"></select>
                <input type="number" id="grade-score" min="0" max="200" step="0.01" placeholder="100" aria-label="Score">
                <p>%</p>
            </div>
            <div class="grade-buttons">
                <button type="button" id="save-grade">Add</button>
                <button type="button" id="cancel-grade" hidden>Cancel</button>
                <button type="button" id="delete-grade">Delete</button>
            </div>
            <p id="grade-message" class="grade-message" role="status"></p>
        </section>
        <button type="button" id="calculate">Calculate My Grade</button>
        <p id="calc-message" class="calc-message" role="status"></p>
        <section class="final">
            <h2>Your final grade:</h2>
            <p id="final-grade"></p>
            <p id="final-percent" hidden>%</p>
        </section>
    </main>
</body>

</html>
