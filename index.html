<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Grade Calculator</title>
</head>
<body>
    <div class="menu">
        <h1>Grade Calculator</h1>
        <button aria-label="fold window button"><img src="assets/fold.png" alt="fold window" width="25"></button>
        <button aria-label="close window button"><img src="assets/exit.png" alt="close window" width="25"></button>
    </div>
    <header>
        <section class="templates">
            <template>
                <div>
                    <input type="text" placeholder="Grade Category">
                    <!-- needs to add up to a hundred!!! -->
                    <input type="number" placeholder="100">
                    <p>%</p>
                </div>
            </template>
            <template>
                <div>
                    <select name="category" ></select>
                    <input type="number">
                    <p>%</p>
                </div>
            </template>
        </section>
    </header>

    <main>
        <section class="category-weight">
            <h2>Category Weight</h2>
            <div class="scroll-category">
                <input type="text" placeholder="Grade Category">
                <input type="number" placeholder="100">
            </div>
            <button type="button" class="add-category">Add</button>
            <button type="button" class="delete-category">Delete</button>
        </section>
        <section class="calculator">
            <h2>Category</h2>
            <h2>Grade</h2>
            <div class="scroll-calculator"></div>
            <button type="button">Add</button>
            <button type="button">Delete</button>
        </section>
        <section class="final">
            <h2>Your final grade:</h2>
            <p></p>
            <p>%</p>
        </section>
    </main>
</body>
</html>
